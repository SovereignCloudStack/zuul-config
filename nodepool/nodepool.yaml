---
images-dir: /opt/nodepool/images
elements-dir: /data/current/nodepool/elements
webapp:
  port: 8005

zookeeper-servers:
  - host: zookeeper.zuul-ci.svc.cluster.local
    port: 2281

zookeeper-tls:
  cert: /tls/client/tls.crt
  key: /tls/client/tls.key
  ca: /tls/client/ca.crt

diskimages:
  - name: base
    abstract: true
    elements:
      - vm
      - block-device-efi
      - growroot
      - enable-serial-console
      - cloud-init
      - pkg-map
      - infra-package-needs
      - zuul-worker
    env-vars:
      DIB_CHECKSUM: '1'
      DIB_CLOUD_INIT_DATASOURCES: OpenStack
      DIB_IMAGE_CACHE: /opt/dib_cache
      TMPDIR: /opt/dib_tmp
      ZUUL_USER_SSH_PUBLIC_KEY: |
        ssh-rsa 
    formats:
     - qcow2

  - name: ubuntu-jammy
    elements:
      - ubuntu-minimal
    env-vars:
      DIB_APT_LOCAL_CACHE: '0'
      DIB_DISABLE_APT_CLEANUP: '1'
      DIB_RELEASE: jammy
      FS_TYPE: ext3
    formats:
      - qcow2
    parent: base
    pause: false
    rebuild-age: 86400
    release: jammy
    username: ubuntu

  - name: ubuntu-noble
    elements:
      - ubuntu-minimal
    env-vars:
      DIB_APT_LOCAL_CACHE: '0'
      DIB_DISABLE_APT_CLEANUP: '1'
      DIB_RELEASE: noble
      FS_TYPE: ext3
    formats:
      - qcow2
    parent: base
    rebuild-age: 86400
    release: noble
    username: ubuntu

  - name: ubuntu-resolute
    elements:
      - ubuntu-minimal
    env-vars:
      DIB_APT_LOCAL_CACHE: '0'
      DIB_DISABLE_APT_CLEANUP: '1'
      DIB_RELEASE: resolute
      FS_TYPE: ext4
    formats:
      - qcow2
    parent: base
    rebuild-age: 86400
    release: resolute
    username: ubuntu

labels:
  - name: ubuntu-jammy
  - name: ubuntu-noble-large
    min-ready: 1
  - name: ubuntu-noble
    min-ready: 2
  - name: ubuntu-resolute
    min-ready: 1
  - name: pod-fedora-latest
  - name: pod-fedora-40
  - name: pod-fedora-44

providers:
  - name: osinfra
    driver: kubernetes
    context: zuul
    pools:
      - name: zuul
        labels:
          - name: pod-fedora-latest
            type: pod
            image: registry.scs.community/zuul/pod-fedora:44
            cpu: 2
            memory: 2048
          - name: pod-fedora-44
            type: pod
            image: registry.scs.community/zuul/pod-fedora:44
            cpu: 2
            memory: 2048
          - name: pod-fedora-40
            type: pod
            image: registry.scs.community/zuul/pod-fedora:40
            cpu: 2
            memory: 2048

  - boot-timeout: 180
    cloud: gx-scs2
    diskimages:
      - name: ubuntu-jammy
      - name: ubuntu-noble
    driver: openstack
    launch-retries: 3
    name: gx-scs2
    pools:
      - labels:
          - console-log: true
            diskimage: ubuntu-jammy
            flavor-name: SCS-2V-8-20
            key-name: zuul-nodepool
            name: ubuntu-jammy
          - console-log: true
            diskimage: ubuntu-noble
            flavor-name: SCS-4V-8-20
            key-name: zuul-nodepool
            name: ubuntu-noble-large
          - console-log: true
            diskimage: ubuntu-noble
            flavor-name: SCS-2V-8-20
            key-name: zuul-nodepool
            name: ubuntu-noble
          - console-log: true
            diskimage: ubuntu-resolute
            flavor-name: SCS-2V-8-20
            key-name: zuul-nodepool
            name: ubuntu-resolute
        max-servers: 10
        name: main
        networks:
          - p500924-scs-zuul-network
        security-groups:
          - zuul_secgroup
    rate: 3.0
    region-name: scs2
